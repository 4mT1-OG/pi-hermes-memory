<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Obsidian vault as the single memory layer shared by Pi-Bolt and Hermes">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect width="1200" height="680" fill="#ffffff"/>

  <!-- Title -->
  <text x="600" y="52" text-anchor="middle" font-size="27" font-weight="bold" fill="#1e1e2e">Obsidian is the memory</text>
  <text x="600" y="80" text-anchor="middle" font-size="14" fill="#6b7280">single-vault topology — Markdown is the source of truth, shared by both harnesses</text>

  <!-- Pi-Bolt agent -->
  <g>
    <rect x="50" y="150" width="420" height="130" rx="10" fill="#16213e" stroke="#0f3460" stroke-width="2"/>
    <text x="260" y="188" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">Pi-Bolt (pi-coder)</text>
    <text x="260" y="216" text-anchor="middle" font-size="13" fill="#a8b2d8">pi-hermes-memory · policy-only mode</text>
    <text x="260" y="240" text-anchor="middle" font-size="13" fill="#a8b2d8">9 skills · obsidian tooling · ponytail</text>
    <text x="260" y="264" text-anchor="middle" font-size="12" fill="#7c8cc4">no compaction overrides of its own</text>
  </g>

  <!-- Hermes agent -->
  <g>
    <rect x="50" y="330" width="420" height="130" rx="10" fill="#16213e" stroke="#0f3460" stroke-width="2"/>
    <text x="260" y="368" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">Hermes</text>
    <text x="260" y="396" text-anchor="middle" font-size="13" fill="#a8b2d8">owns context compression · 0.70 / 0.65</text>
    <text x="260" y="420" text-anchor="middle" font-size="13" fill="#a8b2d8">own skills + tools · ponytail (lite) shared</text>
    <text x="260" y="444" text-anchor="middle" font-size="12" fill="#7c8cc4">own memory dir, untouched</text>
  </g>

  <!-- Arrows: agents to vault -->
  <g stroke="#7c3aed" stroke-width="2.5" fill="none">
    <line x1="470" y1="215" x2="620" y2="215" marker-end="url(#arrow)"/>
    <line x1="470" y1="395" x2="620" y2="395" marker-end="url(#arrow)"/>
  </g>
  <text x="545" y="205" text-anchor="middle" font-size="13" fill="#7c3aed">read / write</text>
  <text x="545" y="385" text-anchor="middle" font-size="13" fill="#7c3aed">read / write</text>

  <!-- Obsidian vault -->
  <g>
    <rect x="620" y="110" width="530" height="390" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2.5"/>
    <text x="885" y="150" text-anchor="middle" font-size="19" font-weight="bold" fill="#4c1d95">Obsidian vault — Hesa</text>
    <text x="885" y="174" text-anchor="middle" font-size="12.5" fill="#6d28d9">~/Hesa/AgentMemory/.pi-memory</text>
    <line x1="650" y1="192" x2="1120" y2="192" stroke="#ddd6fe" stroke-width="1.5"/>
    <g font-size="13.5" fill="#374151">
      <text x="655" y="228"><tspan font-weight="bold" fill="#1e1e2e">MEMORY.md</tspan><tspan fill="#6b7280"> — global notes · environment facts · durable learnings</tspan></text>
      <text x="655" y="264"><tspan font-weight="bold" fill="#1e1e2e">USER.md</tspan><tspan fill="#6b7280"> — user profile · preferences · standing instructions</tspan></text>
      <text x="655" y="300"><tspan font-weight="bold" fill="#1e1e2e">failures.md</tspan><tspan fill="#6b7280"> — corrections · insights · tool quirks</tspan></text>
      <text x="655" y="336"><tspan font-weight="bold" fill="#1e1e2e">skills/</tspan><tspan fill="#6b7280"> — ponytail (lite) · obsidian-* · defuddle · knap</tspan></text>
      <text x="655" y="372"><tspan font-weight="bold" fill="#1e1e2e">projects-memory/</tspan><tspan fill="#6b7280"> — per-project conventions and decisions</tspan></text>
    </g>
    <line x1="650" y1="398" x2="1120" y2="398" stroke="#ddd6fe" stroke-width="1.5"/>
    <text x="885" y="426" text-anchor="middle" font-size="13" font-style="italic" fill="#4c1d95">one vault — human-readable notes and agent memory in the same place</text>
    <text x="885" y="452" text-anchor="middle" font-size="12" fill="#6d28d9">atomic writes + rollback · auto-consolidate on overflow</text>
  </g>

  <!-- Sync arrow to mirror -->
  <line x1="885" y1="500" x2="885" y2="538" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="905" y="524" font-size="12.5" fill="#7c3aed">sync</text>

  <!-- SQLite mirror -->
  <g>
    <rect x="620" y="540" width="530" height="76" rx="10" fill="#f8f9fa" stroke="#6c757d" stroke-width="2" stroke-dasharray="7,5"/>
    <text x="885" y="570" text-anchor="middle" font-size="15" font-weight="bold" fill="#374151">SQLite mirror + FTS5</text>
    <text x="885" y="594" text-anchor="middle" font-size="12.5" fill="#6c757d">derived search index — rebuilt from Markdown, never the source</text>
  </g>

  <!-- Footer -->
  <text x="600" y="656" text-anchor="middle" font-size="13" fill="#6b7280">Markdown = source of truth · SQLite = mirror · both harnesses converge on one vault</text>
</svg>